[project]
name = "spritesheet"
version = "0.1.0"
description = "A text-to-pixel-art neural network compiled into native Google Sheets formulas"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2",
  "torch>=2.4",
  "openpyxl>=3.1",
  "pillow>=10",
  "transformers>=4.44",
  "safetensors",
  "resvg-py",
  "pytest>=8",
  "pyarrow>=26.0.1",
  "pandas>=3.1.0",
  "google-auth>=2.62.1",
  "requests>=2.34.2",
  "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spritesheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
